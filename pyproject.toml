[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photostudio"
version = "1.2.0"
description = "Offline-first Windows photo & design studio"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.8.1",
    "numpy==2.1.3",
    "Pillow==11.0.0",
    "opencv-python-headless==4.10.0.84",
]

[project.scripts]
photostudio = "photostudio.app:main"

[tool.setuptools.packages.find]
include = ["photostudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pytest]
qt_api = "pyside6"
